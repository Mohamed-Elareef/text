# nginx location block for the Chrome Session MCP, served under a path on the
# existing MCP subdomain (path-based routing so all MCPs share one subdomain and
# one Cloudflare-managed TLS cert). Insert this INSIDE the existing
#   server { server_name mcp.cloudstars.club; ... }
# block, BEFORE the catch-all `location /` that proxies to the old MCP.
#
# Result:  https://mcp.cloudstars.club/chrome/mcp   ->  127.0.0.1:8765/mcp
#
# The trailing slash on proxy_pass strips the /chrome/ prefix, so /chrome/mcp
# reaches the container as /mcp and /chrome/health as /health.
# proxy_buffering off + long timeouts keep MCP's SSE (text/event-stream) stream
# flowing through nginx (Cloudflare free plan still caps idle streams ~100s, but
# the MCP client reconnects automatically).

location /chrome/ {
    proxy_pass http://127.0.0.1:8765/;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    # streaming (SSE) friendliness
    proxy_buffering            off;
    proxy_cache                off;
    proxy_read_timeout         3600s;
    proxy_send_timeout         3600s;
    chunked_transfer_encoding  on;
}
